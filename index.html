<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2733">
<title>Foto stroja</title>
<style>
  :root { --ink:#1C2733; --soft:#5B6B7C; --paper:#EEF2F5; --line:#D3DBE3; --blue:#2F5D8A; --wa:#1F8A4C; --red:#C8322B; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif; -webkit-text-size-adjust:100%; }
  main { max-width:560px; margin:0 auto; padding:20px 16px calc(40px + env(safe-area-inset-bottom)); }
  .plate { background:#fff; border:3px solid var(--ink); border-radius:10px; padding:16px 18px; margin-bottom:18px; }
  .group { font-weight:700; letter-spacing:.08em; font-size:15px; }
  .serial { font-weight:800; font-size:48px; line-height:1.05; letter-spacing:-.02em; }
  .meta { color:var(--soft); font-size:14px; margin-top:6px; }
  button, a.btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; border:none; border-radius:12px;
    padding:18px; font-size:19px; font-weight:700; cursor:pointer; text-decoration:none; margin-bottom:12px; font-family:inherit; }
  button:focus-visible, a:focus-visible { outline:3px solid var(--blue); outline-offset:3px; }
  .primary { background:var(--blue); color:#fff; }
  .wa { background:var(--wa); color:#fff; }
  .ghost { background:#fff; color:var(--ink); border:1px solid var(--line); font-size:16px; padding:14px; }
  .thumbs { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:4px 0 16px; }
  .thumbs img { width:100%; border-radius:8px; display:block; border:1px solid var(--line); }
  .hint { color:var(--soft); font-size:14px; line-height:1.45; }
  .msg { font-size:15px; margin:0 0 12px; }
  .err { color:var(--red); }
  .list a { display:block; background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:8px;
    color:var(--ink); text-decoration:none; font-weight:700; font-size:18px; }
  .list small { display:block; color:var(--soft); font-weight:500; font-size:12px; letter-spacing:.08em; }
  h1 { font-size:24px; margin:0 0 14px; }
  h2 { font-size:13px; letter-spacing:.08em; color:var(--soft); margin:18px 0 8px; }
  input[type=file] { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
</style>
</head>
<body>
<main id="app"></main>

<script>
const MACHINES = [
  ["Boxcloser","206"],["Boxcloser","235"],["Boxcloser","236"],["Boxcloser","2S 117"],["Boxcloser","2S 118"],
  ["Powerboxer","G3 342"],["Powerboxer","G3 343"],["Powerboxer","G3 344"],["Powerboxer","G3 345"],["Powerboxer","G3 346"],
  ["Powerboxer","G4N 113"],["Powerboxer","G4N 114"]
].map(([group, serial]) => ({ group, serial, name: group + " " + serial,
  slug: (group + "-" + serial).toLowerCase().replace(/\s+/g, "-") }));

const app = document.getElementById("app");
const slug = (new URLSearchParams(location.search).get("m") || "").toLowerCase();
const machine = MACHINES.find(m => m.slug === slug);
let photos = [];

const pad = n => String(n).padStart(2, "0");
const stampText = d => `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}  ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fileStamp = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function renderPicker() {
  const block = g => MACHINES.filter(m => m.group === g)
    .map(m => `<a href="?m=${m.slug}"><small>${m.group.toUpperCase()}</small>${esc(m.serial)}</a>`).join("");
  app.innerHTML = `<h1>Vyberte stroj</h1>
    <div class="list"><h2>BOXCLOSER</h2>${block("Boxcloser")}<h2>POWERBOXER</h2>${block("Powerboxer")}</div>`;
}

function render(msg, isErr) {
  const has = photos.length > 0;
  app.innerHTML = `
    <div class="plate">
      <div class="group">${machine.group.toUpperCase()}</div>
      <div class="serial">${esc(machine.serial)}</div>
      <div class="meta">Názov stroja, dátum a čas sa vpíšu priamo do fotky.</div>
    </div>
    ${msg ? `<p class="msg ${isErr ? "err" : ""}">${esc(msg)}</p>` : ""}
    ${has ? `<div class="thumbs">${photos.map(p => `<img src="${p.url}" alt="Fotka ${esc(machine.name)}">`).join("")}</div>` : ""}
    <button class="${has ? "ghost" : "primary"}" id="shoot">📷 ${has ? "Pridať ďalšiu fotku" : "Odfotiť panel"}</button>
    <input type="file" id="file" accept="image/*" capture="environment">
    ${has ? `<button class="wa" id="share">Poslať do WhatsApp (${photos.length})</button>
             <button class="ghost" id="clear">Zahodiť fotky</button>` : ""}
    <p class="hint">Fotite tak, aby boli všetky frekvenčáky a ich displeje čitateľné. Ak sa nezmestia do jedného záberu, pridajte druhú fotku.</p>
    <div id="fallback"></div>`;
  document.getElementById("shoot").onclick = () => document.getElementById("file").click();
  document.getElementById("file").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) addPhoto(f); };
  if (has) {
    document.getElementById("share").onclick = share;
    document.getElementById("clear").onclick = () => { photos.forEach(p => URL.revokeObjectURL(p.url)); photos = []; render(); };
  }
}

function loadImage(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error("load"));
    img.src = URL.createObjectURL(file);
  });
}

async function addPhoto(file) {
  render("Spracúvam fotku…");
  try {
    const img = await loadImage(file);
    const MAX = 2400, scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
    const barH = Math.round(Math.max(w, h) * 0.065);
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h + barH;
    const ctx = cv.getContext("2d");
    ctx.drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(img.src);

    // pruh s názvom stroja pod fotkou
    ctx.fillStyle = "#000"; ctx.fillRect(0, h, w, barH);
    const now = new Date(), right = stampText(now), padX = barH * 0.35;
    let fs = barH * 0.55;
    const font = s => `800 ${s}px -apple-system, "Segoe UI", Roboto, sans-serif`;
    ctx.font = font(fs);
    while (fs > 8 && ctx.measureText(machine.name.toUpperCase()).width + ctx.measureText(right).width * 0.75 + padX * 3 > w) {
      fs -= 1; ctx.font = font(fs);
    }
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#FFD400"; ctx.textAlign = "left";
    ctx.fillText(machine.name.toUpperCase(), padX, h + barH / 2);
    ctx.font = `600 ${fs * 0.72}px -apple-system, "Segoe UI", Roboto, sans-serif`;
    ctx.fillStyle = "#fff"; ctx.textAlign = "right";
    ctx.fillText(right, w - padX, h + barH / 2);

    const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.86));
    photos.push({ blob, url: URL.createObjectURL(blob), time: now });
    render();
  } catch (e) {
    render("Fotku sa nepodarilo spracovať. Skúste to znova.", true);
  }
}

async function share() {
  const t = photos[0].time;
  const files = photos.map((p, i) => new File([p.blob], `${machine.slug}_${fileStamp(t)}_${i + 1}.jpg`, { type: "image/jpeg" }));
  const text = `${machine.name} – ${stampText(t)}`;
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files, text }); }
    catch (e) { if (e.name !== "AbortError") render("Zdieľanie zlyhalo. Skúste to znova.", true); }
    return;
  }
  // záloha pre prehliadače bez zdieľania súborov
  document.getElementById("fallback").innerHTML =
    `<p class="hint err">Tento prehliadač nevie posielať fotky priamo. Uložte si ich a pošlite do skupiny ručne:</p>` +
    files.map((f, i) => `<a class="btn ghost" href="${photos[i].url}" download="${f.name}">Uložiť fotku ${i + 1}</a>`).join("");
}

machine ? render() : renderPicker();
</script>
</body>
</html>
